[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-altitude-vrpd"
version = "1.0.0"
description = "Truck-drone collaborative delivery: MILP + GA reproduction of Gong (2025), Shenzhen case study"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Junxiang Gong" }]
requires-python = ">=3.10"
keywords = ["vehicle routing", "drones", "VRPD", "MILP", "genetic algorithm", "Gurobi", "low-altitude economy"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "gurobipy>=11.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Sidbaobao/low-altitude-vrpd"

[tool.setuptools]
packages = ["vrpd", "vrpd.models"]
