name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (no solver)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m "not gurobi"

  gurobi-quick:
    # The 12-customer models fit the size-limited licence that ships with `pip install gurobipy`;
    # this job is informational and never fails the workflow.
    name: Gurobi smoke tests (size-limited licence)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -m gurobi
